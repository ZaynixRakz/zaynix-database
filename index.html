<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAYNIX - Key Management Dashboard</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #111827; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 90%; max-width: 420px; text-align: center; border: 1px solid #1f2937; }
        h2 { color: #38bdf8; margin-bottom: 5px; font-size: 26px; letter-spacing: 1px; font-weight: 800; }
        .subtitle { color: #9ca3af; font-size: 13px; margin-bottom: 25px; }
        input, select { width: 100%; padding: 14px; margin: 12px 0; border-radius: 8px; border: 1px solid #374151; background-color: #1f2937; color: white; box-sizing: border-box; font-size: 15px; }
        input:focus, select:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; padding: 14px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .hidden { display: none; }
        .key-box { background: #070a12; padding: 18px; border-radius: 8px; margin-top: 20px; border: 1px dashed #38bdf8; word-break: break-all; text-align: left; }
        .key-title { color: #38bdf8; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .key-value { font-family: monospace; font-size: 16px; color: #10b981; }
    </style>
</head>
<body>
    <!-- LOGIN PANEL ADMIN -->
    <div class="box" id="loginBox">
        <h2>ZAYNIX INJECT</h2>
        <p class="subtitle">Key Management Dashboard</p>
        <input type="text" id="username" placeholder="Username Admin">
        <input type="password" id="password" placeholder="Password Admin">
        <button onclick="login()">Login Panel</button>
    </div>

    <!-- PANEL UTAMA GENERATE KEY -->
    <div class="box hidden" id="dashboardBox">
        <h2>ZAYNIX PANEL</h2>
        <p class="subtitle" style="color:#10b981">● Database GitHub Terhubung Online</p>
        <input type="text" id="note" placeholder="Nama Pembeli / Keterangan">
        <select id="duration">
            <option value="1">Sewa 1 Hari</option>
            <option value="3">Sewa 3 Hari</option>
            <option value="7">Sewa 7 Hari</option>
            <option value="30">Sewa 30 Hari</option>
            <option value="40">Sewa 40 Hari</option>
            <option value="3650">Lifetime (Selamanya)</option>
        </select>
        <button onclick="generateKey()">Buat & Simpan Lisensi</button>
        <div id="resultBox" class="hidden">
            <div class="key-box">
                <div class="key-title">🔑 KODE LISENSI AKTIF:</div>
                <div class="key-value" id="finalKey"></div>
                <div style="font-size:12px; color:#9ca3af; margin-top:8px;" id="expiryText"></div>
            </div>
        </div>
    </div>

    <script>
        // 🔐 DATA AKUN DAN DATABASE SESUAI REQ ANDA
        const ADMIN_USER = "ZaynixRakz"; 
        const ADMIN_PASS = "Rakzbarton"; 
        const GITHUB_TOKEN = "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"; 
        const REPO_OWNER = "ZaynixRakz"; 
        const REPO_NAME = "zaynix-database"; 

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                Swal.fire({ title: 'Sukses', text: 'Login Berhasil!', icon: 'success', timer: 1500, showConfirmButton: false }).then(() => {
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('dashboardBox').classList.remove('hidden');
                });
            } else {
                Swal.fire('Gagal', 'Username atau Password Salah!', 'error');
            }
        }

        async function generateKey() {
            const note = document.getElementById('note').value.trim();
            const duration = parseInt(document.getElementById('duration').value);
            if(!note) return Swal.fire('Peringatan', 'Mohon isi nama pembeli!', 'warning');
            Swal.fire({ title: 'Memproses...', text: 'Menyimpan key ke GitHub', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            
            let expDate = new Date();
            expDate.setDate(expDate.getDate() + duration);
            const expString = expDate.toISOString().split('T')[0];
            const randomHex = Math.random().toString(16).substring(2, 8).toUpperCase();
            const generatedKey = `ZAYNIX-${duration}D-${randomHex}`;
            const url = `https://github.com{REPO_OWNER}/${REPO_NAME}/contents/keys.json`;

            try {
                let res = await fetch(url, { headers: { Authorization: `token ${GITHUB_TOKEN}` } });
                let fileData = await res.json();
                let currentKeys = JSON.parse(atob(fileData.content));
                currentKeys.push({ key: generatedKey, hwid: "", note: note, expired: expString });
                
                let updateRes = await fetch(url, {
                    method: 'PUT',
                    headers: { Authorization: `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Key ${note}`, content: btoa(JSON.stringify(currentKeys, null, 2)), sha: fileData.sha })
                });
                Swal.close();
                if(updateRes.ok) {
                    document.getElementById('resultBox').classList.remove('hidden');
                    document.getElementById('finalKey').innerText = generatedKey;
                    document.getElementById('expiryText').innerText = "📅 Berlaku hingga: " + expString;
                    Swal.fire('Berhasil', 'Kunci lisensi berhasil disimpan!', 'success');
                } else { Swal.fire('Gagal', 'Gagal update database.', 'error'); }
            } catch (err) { Swal.close(); Swal.fire('Error', 'Terjadi kesalahan sistem.', 'error'); }
        }
    </script>
</body>
</html>
